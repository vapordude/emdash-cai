[package]
name    = "emdash-sandbox"
version = "0.1.0"
edition = "2024"

[features]
# Enable the Wasmtime-based sandbox.  Off by default to keep default
# builds fast and the binary small.
wasmtime-sandbox = ["dep:wasmtime", "dep:dashmap"]

[dependencies]
async-trait = { workspace = true }
serde_json  = { workspace = true }
emdash-core = { workspace = true }

# Optional — only compiled with the `wasmtime-sandbox` feature.
wasmtime = { workspace = true, optional = true }
dashmap  = { workspace = true, optional = true }
